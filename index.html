<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find and Replace</title>
  <style>
    .color-box {
      width: 150px;
      height: 30px;
      margin: 5px;
      border: 1px solid #ccc;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <input type="text" id="find1" class="color-box" placeholder="Enter Hex Code">
    <input type="text" id="find2" class="color-box" placeholder="Enter Hex Code">
    <input type="text" id="find3" class="color-box" placeholder="Enter Hex Code">
    <input type="text" id="find4" class="color-box" placeholder="Enter Hex Code">
    <input type="text" id="find5" class="color-box" placeholder="Enter Hex Code">
    <input type="text" id="find6" class="color-box" placeholder="Enter Hex Code">
    <input type="text" id="find7" class="color-box" placeholder="Enter Hex Code">
    <input type="text" id="find8" class="color-box" placeholder="Enter Hex Code">
  </div>

  <script>
    // Function to validate Hex color and apply it as background
    function applyBackgroundColor(input) {
      const hex = input.value.trim();
      const isValidHex = /^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(hex); // Validate Hex format
      
      if (isValidHex) {
        input.style.backgroundColor = hex; // Apply Hex color
      } else {
        input.style.backgroundColor = ''; // Reset to default
      }
    }

    // Attach event listeners to input boxes
    document.querySelectorAll('.color-box').forEach(input => {
      input.addEventListener('input', () => applyBackgroundColor(input));
    });
  </script>
</body>
</html>
